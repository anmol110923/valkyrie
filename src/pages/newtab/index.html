<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New Tab</title>
  <link rel="icon" href="valkyrie://assets/icon.svg" />
  <style>
    :root { --bg: #f6f4fb; --text: #1f1d26; --muted: #7a7788; --card: #fff; --accent: #6d55e0; --chip: rgba(0,0,0,.05); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1b24; --text: #ecebf2; --muted: #8c8a99; --card: #2a2733; --accent: #9b87f5; --chip: rgba(255,255,255,.07); }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 16px; }
    #clock { font-size: 72px; font-weight: 200; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    #greeting { margin-top: -20px; color: var(--muted); }
    form { width: min(560px, 100%); }
    input { width: 100%; height: 48px; padding: 0 18px; border: 0; border-radius: 14px; outline: 0; box-sizing: border-box;
      background: var(--card); color: var(--text); font: inherit; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    input:focus { box-shadow: 0 0 0 2px var(--accent); }
    #today { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 34px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px;
      background: var(--chip); color: var(--text); text-decoration: none; font-size: 13px; }
    .chip strong { font-weight: 600; }
    .chip.main { background: var(--accent); color: #fff; }
    .site-icon { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; overflow: hidden; font-size: 10px; font-weight: 700; }
    .site-icon img { width: 16px; height: 16px; }
    .site-icon.letter { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <main>
    <div id="clock"></div>
    <div id="greeting"></div>
    <form action="https://www.google.com/search" method="get">
      <input name="q" placeholder="Search Google" autocomplete="off" />
    </form>
    <nav id="today"></nav>
  </main>
  <script src="valkyrie://assets/common.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
