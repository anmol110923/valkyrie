<!doctype html>
<html data-color="violet">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <style>
    /* Window background behind the sidebar and pages, tinted with the current space's colour. */
    :root { --tint: 155 135 245; --base: #17161c; --base-2: #121a22; }
    html[data-color="violet"] { --tint: 155 135 245; }
    html[data-color="gold"] { --tint: 236 166 64; }
    html[data-color="rose"] { --tint: 236 106 150; }
    html[data-color="teal"] { --tint: 45 190 180; }
    html[data-color="blue"] { --tint: 84 150 245; }
    html[data-color="green"] { --tint: 92 190 110; }
    html[data-color="slate"] { --tint: 140 150 170; }
    @media (prefers-color-scheme: light) { :root { --base: #f1eff6; --base-2: #ebeef3; } }
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(160deg, rgb(var(--tint) / 0.34) 0%, var(--base) 55%, var(--base-2) 100%);
      background-color: var(--base);
      transition: background 0.4s;
      -webkit-app-region: drag; /* gaps around the page drag the window */
    }
  </style>
</head>
<body></body>
</html>
