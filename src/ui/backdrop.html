<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(160deg, #241f33 0%, #17161c 55%, #121a22 100%);
      -webkit-app-region: drag; /* gaps around the page drag the window */
    }
    @media (prefers-color-scheme: light) {
      body { background: linear-gradient(160deg, #e6defa 0%, #ece9f3 55%, #dfeaf0 100%); }
    }
  </style>
</head>
<body></body>
</html>
