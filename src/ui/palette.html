<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: valkyrie:; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="../pages/assets/fonts.css" />
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <div id="scrim"></div>
  <div class="box" role="dialog" aria-label="Command bar">
    <div class="input-row">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5L14 14" /></svg>
      <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Search tabs, bookmarks, history — or type a command" />
      <kbd>esc</kbd>
    </div>
    <ul id="results" role="listbox"></ul>
    <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span><span><kbd>↵</kbd> to open</span><span><kbd>⌘</kbd><kbd>↵</kbd> new tab</span></div>
  </div>
  <div id="toast" hidden></div>
  <script src="palette.js"></script>
</body>
</html>
