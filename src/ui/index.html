<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: crx: valkyrie:; style-src 'self' 'unsafe-inline'; font-src 'self'" />
  <title>Valkyrie</title>
  <link rel="stylesheet" href="../pages/assets/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="edge" aria-hidden="true"></div>

  <aside id="sidebar">
    <div class="titlebar">
      <div class="nav">
        <button id="toggle-sidebar" title="Toggle sidebar (⌘S)" aria-label="Toggle sidebar">
          <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2" /><path d="M6 3v10" /></svg>
        </button>
        <span class="spacer"></span>
        <button id="back" title="Back (⌘[)" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" /></svg></button>
        <button id="forward" title="Forward (⌘])" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" /></svg></button>
        <button id="reload" title="Reload (⌘R)" aria-label="Reload">
          <svg class="icon-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v3h-3" /></svg>
          <svg class="icon-stop" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </div>
    </div>

    <div class="omnibox-wrap">
      <form id="omnibox">
        <span id="shield" title="Ads & trackers blocked on this page">
          <svg viewBox="0 0 16 16"><path d="M8 1.5l5.5 2v4c0 3.5-2.4 6-5.5 7-3.1-1-5.5-3.5-5.5-7v-4z" /></svg>
          <span id="shield-count">0</span>
        </span>
        <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter URL" />
        <button type="button" id="star" title="Bookmark this page (⌘D)" aria-label="Bookmark this page">
          <svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" /></svg>
        </button>
      </form>
      <ul id="suggestions" role="listbox" hidden></ul>
    </div>

    <div class="toolbar">
      <browser-action-list partition="persist:valkyrie" alignment="bottom right"></browser-action-list>
      <span class="spacer"></span>
      <button id="split-exit" class="chip" hidden title="Exit split view (⌃⇧-)">◫ Exit split</button>
      <button id="palette" class="icon-btn" title="Command bar (⌘K)" aria-label="Command bar">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5L14 14" /></svg>
      </button>
      <button id="webstore" class="icon-btn" title="Get extensions from the Chrome Web Store" aria-label="Chrome Web Store">
        <svg viewBox="0 0 16 16"><path d="M6 2.5h4v2a1.5 1.5 0 1 0 3 0v-.2M2.5 6v4h2a1.5 1.5 0 1 1 0 3h-.2M13.5 13.5h-11v-11h11z" /></svg>
      </button>
    </div>

    <ul id="favorites" class="favorites" data-zone="favorites"></ul>

    <div class="scroll" id="scroll">
      <div class="space-head">
        <button id="space-name" class="space-name" title="Space options"></button>
        <button id="new-folder" class="icon-btn small" title="New folder" aria-label="New folder">
          <svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5zM8 7v4M6 9h4" /></svg>
        </button>
      </div>
      <ul id="pinned" class="tree" data-zone="pinned"></ul>
      <div id="pinned-hint" class="drop-hint" data-zone="pinned">Drag tabs here to pin them</div>

      <div class="divider"><span></span><button id="clear-today" title="Close all unpinned tabs">Clear</button></div>

      <button id="new-tab" class="row new-tab" data-zone="today">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
        New Tab
        <kbd>⌘T</kbd>
      </button>
      <ul id="tabs" data-zone="today"></ul>

      <section id="bookmarks-section" hidden>
        <button class="section-label" id="bookmarks-toggle">
          <svg class="chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" /></svg>
          Bookmarks
        </button>
        <ul id="bookmarks" class="tree"></ul>
      </section>
    </div>

    <div class="footer">
      <button id="wellbeing" class="wellbeing" title="Wellbeing & activity (⌘Y)">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" /><path d="M8 4.5V8l2.5 1.5" /></svg>
        <span>Today</span>
        <strong id="today-total">0s</strong>
        <i id="goal-bar"><b></b></i>
      </button>
      <button id="settings" class="icon-btn boxed" title="Settings (⌘,)" aria-label="Settings">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg>
      </button>
    </div>
    <div class="spaces" id="spaces"></div>
  </aside>

  <div id="toast" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
